# Render Blueprint: one free web service running the API and the built site.
# In Render: New > Blueprint > pick this repository. Render reads this file.
services:
  - type: web
    name: meridian-loop
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/meta
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_MODE
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      # Optional: add ANTHROPIC_API_KEY (Claude answers) and SMTP_URL / DEMO_INBOX (real email) in the Render dashboard.
