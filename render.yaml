# Render Blueprint: one free web service running the API and the built site.
# In Render: New > Blueprint > pick this repository. Render reads this file.
services:
  - type: web
    name: meridian-loop
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_MODE
        value: "1"
      # Add in the Render dashboard: ANTHROPIC_API_KEY (Claude answers), DATABASE_URL (Postgres storage), MERIDIAN_SECRET (session signing).
